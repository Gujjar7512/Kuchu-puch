<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Anees × Kuchu Puchu ❤️</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:#050507;
  color:#fff;
  font-family:Georgia,"Times New Roman",serif;
  overflow-x:hidden;
}
body:before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-3;
  background:
  radial-gradient(circle at 15% 20%,#ff285c33,transparent 30%),
  radial-gradient(circle at 85% 75%,#713cff33,transparent 30%),
  linear-gradient(135deg,#030305,#100711,#020203);
}
.grain{
  position:fixed;
  inset:0;
  z-index:20;
  pointer-events:none;
  opacity:.045;
  background-image:repeating-radial-gradient(circle,#fff 0,#fff 1px,transparent 1px,transparent 4px);
}
#loader{
  position:fixed;
  inset:0;
  background:#030305;
  z-index:100;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  transition:1s;
}
#loader.hide{opacity:0;visibility:hidden}
.loader-heart{font-size:60px;animation:pulse 1.2s infinite}
.loader-text{
  margin-top:18px;
  font-size:11px;
  letter-spacing:5px;
  color:#aaa;
}
@keyframes pulse{50%{transform:scale(1.25)}}

nav{
  position:fixed;
  top:0;
  width:100%;
  padding:20px 28px;
  display:flex;
  justify-content:space-between;
  z-index:50;
  background:linear-gradient(#000b,transparent);
}
.logo{font-weight:bold;letter-spacing:2px}
.logo span{color:#ff557d}
nav a{
  color:white;
  text-decoration:none;
  margin-left:20px;
  font-size:12px;
  opacity:.8;
}

.hero{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:80px 20px;
  position:relative;
  overflow:hidden;
}
.hero-content{
  max-width:900px;
  animation:enter 1.6s ease;
}
@keyframes enter{
  from{opacity:0;transform:translateY(40px)}
  to{opacity:1;transform:translateY(0)}
}
.small{
  text-transform:uppercase;
  letter-spacing:7px;
  color:#ff7795;
  font-size:11px;
  margin-bottom:25px;
}
h1{
  font-size:clamp(55px,12vw,130px);
  line-height:.85;
  font-weight:normal;
  letter-spacing:-5px;
}
h1 span{
  color:#ff557d;
  font-style:italic;
}
.subtitle{
  max-width:650px;
  margin:35px auto;
  color:#c4c4c4;
  line-height:1.9;
  font-size:17px;
}
.scroll{
  color:#999;
  font-size:10px;
  letter-spacing:4px;
  text-transform:uppercase;
}
.scroll:after{
  content:"↓";
  display:block;
  font-size:25px;
  margin-top:12px;
  animation:bounce 1.5s infinite;
}
@keyframes bounce{50%{transform:translateY(8px)}}

.orb{
  position:absolute;
  border-radius:50%;
  filter:blur(5px);
  opacity:.25;
  animation:float 8s infinite ease-in-out;
}
.one{
  width:300px;height:300px;
  background:#ff285c;
  left:-120px;top:20%;
}
.two{
  width:270px;height:270px;
  background:#6b38ff;
  right:-100px;bottom:10%;
}
@keyframes float{50%{transform:translateY(-35px) scale(1.1)}}

section{padding:110px 7%}
.title{
  text-align:center;
  margin-bottom:60px;
}
.title small{
  color:#ff6687;
  letter-spacing:5px;
  text-transform:uppercase;
  font-size:10px;
}
.title h2{
  margin-top:15px;
  font-size:clamp(40px,7vw,75px);
  font-weight:normal;
}

.story{
  max-width:850px;
  margin:auto;
  text-align:center;
}
.story p{
  color:#c7c7c7;
  font-size:18px;
  line-height:2;
  margin-bottom:25px;
}
.quote{
  margin:50px auto;
  padding:30px;
  border-left:2px solid #ff557d;
  background:#ffffff08;
  font-size:24px;
  line-height:1.6;
  font-style:italic;
}

.cards{
  max-width:1100px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:25px;
}
.card{
  min-height:300px;
  padding:30px;
  background:linear-gradient(145deg,#ffffff0d,#ffffff02);
  border:1px solid #ffffff12;
  transition:.5s;
  position:relative;
  overflow:hidden;
}
.card:hover{
  transform:translateY(-12px);
  border-color:#ff557d66;
  box-shadow:0 20px 60px #ff285c1f;
}
.num{
  position:absolute;
  right:20px;
  top:10px;
  font-size:55px;
  color:#ffffff0d;
}
.card h3{
  margin-top:90px;
  font-size:25px;
  font-weight:normal;
}
.card p{
  margin-top:15px;
  color:#aaa;
  line-height:1.7;
  font-size:14px;
}

.letter{
  max-width:800px;
  margin:auto;
  padding:55px;
  text-align:center;
  background:linear-gradient(145deg,#ffffff0d,#ffffff02);
  border:1px solid #ffffff12;
  box-shadow:0 30px 100px #0008;
}
.letter .heart{
  font-size:45px;
  margin-bottom:25px;
}
.letter p{
  color:#d0d0d0;
  line-height:2;
  font-size:17px;
}
.signature{
  margin-top:35px;
  color:#ff6688;
  font-size:25px;
  font-style:italic;
}

.final{
  min-height:70vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
}
.final h2{
  font-size:clamp(45px,9vw,100px);
  font-weight:normal;
  line-height:1;
}
.final span{
  color:#ff557d;
  font-style:italic;
}
.final p{
  margin-top:30px;
  color:#aaa;
}
.final-heart{
  margin-top:35px;
  font-size:55px;
  animation:pulse 1.5s infinite;
}

footer{
  padding:35px 20px;
  text-align:center;
  border-top:1px solid #ffffff0d;
  color:#777;
  font-size:11px;
  letter-spacing:2px;
}

.reveal{
  opacity:0;
  transform:translateY(45px);
  transition:1s;
}
.reveal.show{
  opacity:1;
  transform:translateY(0);
}

.float-heart{
  position:fixed;
  bottom:-30px;
  z-index:30;
  pointer-events:none;
  animation:rise 5s linear forwards;
}
@keyframes rise{
  from{transform:translateY(0);opacity:0}
  15%{opacity:1}
  to{transform:translateY(-110vh) rotate(360deg);opacity:0}
}

@media(max-width:800px){
  nav .links{display:none}
  section{padding:80px 20px}
  .cards{grid-template-columns:1fr}
  .letter{padding:35px 22px}
  .quote{font-size:20px}
}
</style>
</head>

<body>

<div id="loader">
  <div class="loader-heart">❤️</div>
  <div class="loader-text">A little story about two friends...</div>
</div>

<div class="grain"></div>

<nav>
  <div class="logo">ANEES <span>×</span> KUCHU PUCHU</div>
  <div class="links
